<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-label="Context-Saver architecture: one gateway between the AI client and N downstream MCP servers, loading tool schemas on demand">
  <title>Context-Saver architecture</title>
  <defs>
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h    { font-size: 16px; font-weight: 700; fill: #f0f6fc; }
      .sub  { font-size: 11px; fill: #8b949e; }
      .mod  { font-size: 12px; fill: #e6edf3; }
      .modk { font-size: 12px; font-weight: 700; fill: #79c0ff; }
      .box  { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
      .modb { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .gw   { fill: #11161d; stroke: #388bfd; stroke-width: 1.8; }
      .arrow{ stroke: #8b949e; stroke-width: 1.6; fill: none; }
      .dash { stroke: #3fb950; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .albl { font-size: 10.5px; fill: #8b949e; }
      .alblg{ font-size: 10.5px; fill: #3fb950; }
      .cap  { font-size: 11px; fill: #6e7681; }
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="439" rx="12" fill="#0d1117"/>

  <!-- ── your AI client ─────────────────────────────────────────────── -->
  <rect class="box" x="16" y="118" width="184" height="180" rx="10"/>
  <text class="h" x="108" y="148" text-anchor="middle">your AI client</text>
  <text class="sub mono" x="108" y="168" text-anchor="middle">configure one server</text>
  <g class="mono mod" text-anchor="middle">
    <text x="108" y="200">Claude Code</text>
    <text x="108" y="222">Cursor</text>
    <text x="108" y="244">Claude Desktop</text>
  </g>
  <text class="sub mono" x="108" y="278" text-anchor="middle">tools/list = 6, always</text>

  <!-- ── the gateway ─────────────────────────────────────────────────── -->
  <rect class="gw" x="272" y="56" width="420" height="316" rx="12"/>
  <text class="h mono" x="482" y="86" text-anchor="middle">context-saver</text>
  <text class="sub" x="482" y="104" text-anchor="middle">the only MCP server you configure</text>

  <rect class="modb" x="288" y="118" width="388" height="60" rx="7"/>
  <text class="modk mono" x="300" y="137">6 meta-tools — ≈676 tok, fixed</text>
  <text class="mod mono"  x="300" y="154">cs_discover · cs_plan · cs_load · cs_call</text>
  <text class="mod mono"  x="300" y="170">cs_unload · cs_status</text>

  <rect class="modb" x="288" y="186" width="388" height="44" rx="7"/>
  <text class="modk mono" x="300" y="204">planner — cs_plan</text>
  <text class="mod mono"  x="300" y="221">task → the minimal toolset (catalog-scored)</text>

  <rect class="modb" x="288" y="238" width="388" height="44" rx="7"/>
  <text class="modk mono" x="300" y="256">lazy router</text>
  <text class="mod mono"  x="300" y="273">connect · fetch schema · call · reap</text>

  <rect class="modb" x="288" y="290" width="388" height="44" rx="7"/>
  <text class="modk mono" x="300" y="308">OAuth 2.1 · Streamable HTTP + SSE</text>
  <text class="mod mono"  x="300" y="325">remote-ready: one URL, popup login, PKCE</text>

  <text class="sub mono" x="482" y="358" text-anchor="middle">catalog cached on disk — discovery costs zero connections</text>

  <!-- ── downstream servers ──────────────────────────────────────────── -->
  <rect class="box" x="800" y="96" width="170" height="240" rx="10"/>
  <text class="h" x="885" y="126" text-anchor="middle">downstream</text>
  <text class="sub mono" x="885" y="144" text-anchor="middle">N MCP servers</text>
  <g class="mono mod" text-anchor="middle">
    <text x="885" y="176">filesystem</text>
    <text x="885" y="200">github</text>
    <text x="885" y="224">postgres</text>
    <text x="885" y="248">your scrapers</text>
    <text x="885" y="272" fill="#8b949e">… dozens more</text>
  </g>
  <text class="sub mono" x="885" y="312" text-anchor="middle">spawned / dialed</text>
  <text class="sub mono" x="885" y="328" text-anchor="middle">only when a tool loads</text>

  <!-- ── arrows ──────────────────────────────────────────────────────── -->
  <line class="arrow" x1="200" y1="196" x2="266" y2="196" marker-end="url(#m)" marker-start="url(#m)"/>
  <line class="arrow" x1="200" y1="236" x2="266" y2="236" marker-end="url(#m)" marker-start="url(#m)"/>
  <text class="albl mono" x="233" y="184" text-anchor="middle">1 JSON-RPC</text>
  <text class="albl mono" x="233" y="256" text-anchor="middle">connection</text>

  <line class="dash" x1="692" y1="182" x2="794" y2="182" marker-end="url(#mg)"/>
  <line class="dash" x1="692" y1="212" x2="794" y2="212" marker-end="url(#mg)"/>
  <line class="dash" x1="692" y1="242" x2="794" y2="242" marker-end="url(#mg)"/>
  <text class="alblg mono" x="746" y="168" text-anchor="middle">on demand:</text>
  <text class="alblg mono" x="746" y="262" text-anchor="middle">schema per tool</text>

  <!-- ── per-turn sequence strip ─────────────────────────────────────── -->
  <text class="cap mono" x="500" y="400" text-anchor="middle">one turn on the wire:  cs_plan {"task": …}  →  cs_load ["github__create_issue"]  →  tools/call github__create_issue  →  cs_unload</text>
  <text class="cap mono" x="500" y="418" text-anchor="middle">schemas enter the context for the turn that needs them — then leave. no rent.</text>
</svg>
