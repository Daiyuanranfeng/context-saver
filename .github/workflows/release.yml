name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Full test suite before anything ships
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: node context-saver.mjs --doctor

  package:
    name: Bundle ${{ matrix.osname }}-${{ matrix.arch }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, osname: linux, arch: x64 }
          - { os: macos-latest, osname: macos, arch: arm64 }
          - { os: windows-latest, osname: windows, arch: x64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Smoke (doctor) on this platform
        run: node context-saver.mjs --doctor

      - name: Stage bundle
        shell: bash
        run: |
          mkdir -p dist/stage
          cp context-saver.mjs README.md LICENSE CHANGELOG.md server.json llms.txt dist/stage/
          if [ "${{ matrix.osname }}" = "windows" ]; then
            printf '@echo off\r\nrem Context-Saver launcher — requires Node >= 18.17 on PATH\r\nnode "%%~dp0context-saver.mjs" %%*\r\n' > dist/stage/run.cmd
          else
            printf '#!/bin/sh\n# Context-Saver launcher — requires Node >= 18.17\nexec node "$(dirname "$0")/context-saver.mjs" "$@"\n' > dist/stage/run.sh
            chmod +x dist/stage/run.sh
          fi
          ls -la dist/stage

      - name: Archive + checksum (unix)
        if: matrix.osname != 'windows'
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          NAME="context-saver-v${V}-${{ matrix.osname }}-${{ matrix.arch }}"
          tar -czf "dist/${NAME}.tar.gz" -C dist/stage context-saver.mjs README.md LICENSE CHANGELOG.md server.json llms.txt run.sh
          (cd dist && sha256sum "${NAME}.tar.gz" > "SHA256SUMS-${{ matrix.osname }}-${{ matrix.arch }}.txt")
          cat "dist/SHA256SUMS-${{ matrix.osname }}-${{ matrix.arch }}.txt"

      - name: Archive + checksum (windows)
        if: matrix.osname == 'windows'
        shell: pwsh
        run: |
          $V = node -p "require('./package.json').version"
          $Name = "context-saver-v$V-${{ matrix.osname }}-${{ matrix.arch }}"
          Compress-Archive -Path dist/stage/context-saver.mjs, dist/stage/README.md, dist/stage/LICENSE, dist/stage/CHANGELOG.md, dist/stage/server.json, dist/stage/llms.txt, dist/stage/run.cmd -DestinationPath "dist/$Name.zip"
          $hash = (Get-FileHash "dist/$Name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $Name.zip" | Out-File -Encoding ascii "dist/SHA256SUMS-${{ matrix.osname }}-${{ matrix.arch }}.txt"
          Get-Content "dist/SHA256SUMS-${{ matrix.osname }}-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.osname }}-${{ matrix.arch }}
          path: dist/context-saver-v*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: sums-${{ matrix.osname }}-${{ matrix.arch }}
          path: dist/SHA256SUMS-*
          if-no-files-found: error

  release:
    name: GitHub release + npm publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all platform bundles + checksums
        uses: actions/download-artifact@v8
        with:
          path: dist-out

      - name: Merge checksums
        run: |
          find dist-out -name 'SHA256SUMS-*' -exec cat {} \; | sort > dist-out/SHA256SUMS.txt
          cat dist-out/SHA256SUMS.txt
          find dist-out -type f | sort

      - name: Create GitHub release with multi-platform artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-out/**/context-saver-v*
            dist-out/SHA256SUMS.txt

      - name: Publish to npm (skipped without NPM_TOKEN secret)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not configured — skipping npm publish (GitHub release artifacts are published anyway)"
            exit 0
          fi
          echo "publishing context-saver-mcp@$(node -p "require('./package.json').version") to npm"
          npm publish --access public
